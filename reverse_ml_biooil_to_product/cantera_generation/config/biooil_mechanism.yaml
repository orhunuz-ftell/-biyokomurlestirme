description: |-
  Bio-oil Steam Reforming Mechanism

  This mechanism extends GRI-Mech 3.0 with simplified bio-oil surrogate species
  for hydrogen production via steam reforming.

  Bio-oil surrogates:
  - C2H5OH (ethanol) - represents alcohols
  - CH3COOH (acetic acid) - represents acids
  - C6H6O (phenol) - represents phenols
  - C7H8 (toluene) - represents aromatics
  - C4H4O (furan) - represents furans
  - C3H6O (acetone) - represents aldehydes & ketones

  Note: This is a simplified mechanism for data generation purposes.
  Full kinetics use GRI-Mech 3.0 for subsequent reactions.

  Author: Orhun Uzdiyem
  Date: 2025-11-30
  Version: 1.0.0

generator: custom

cantera-version: 3.0.0

phases:
- name: gas
  thermo: ideal-gas
  elements: [O, H, C, N, Ar]
  species: [{biooil_mechanism.yaml/species: all}, {gri30.yaml/species: all}]
  kinetics: gas
  transport: none
  state:
    T: 300.0
    P: 1.01325e+05

species:
# ============================================================================
# BIO-OIL SURROGATE SPECIES
# ============================================================================
# Thermodynamic data from NIST Chemistry WebBook and literature
# NASA 7-coefficient polynomials for Cp/R, H/RT, and S/R

- name: C2H5OH
  composition: {C: 2, H: 6, O: 1}
  thermo:
    model: NASA7
    temperature-ranges: [300.0, 1000.0, 5000.0]
    data:
    # Low temperature range (300-1000 K)
    - [4.85869, -3.74017e-03, 6.95554e-05, -8.86548e-08, 3.51688e-11,
       -2.99962e+04, 4.80185]
    # High temperature range (1000-5000 K)
    - [6.56244, 1.52042e-02, -5.38945e-06, 8.62218e-10, -5.12898e-14,
       -3.13426e+04, -9.47302]
    note: Ethanol, NASA polynomial from Burcat database

- name: CH3COOH
  composition: {C: 2, H: 4, O: 2}
  thermo:
    model: NASA7
    temperature-ranges: [300.0, 1000.0, 5000.0]
    data:
    # Low temperature (simplified from literature)
    - [5.0, 5.0e-03, 3.0e-05, -4.0e-08, 1.5e-11,
       -5.2e+04, 3.0]
    # High temperature
    - [7.5, 1.8e-02, -7.0e-06, 1.2e-09, -7.0e-14,
       -5.4e+04, -12.0]
    note: Acetic acid, simplified thermodynamics

- name: C6H6O
  composition: {C: 6, H: 6, O: 1}
  thermo:
    model: NASA7
    temperature-ranges: [300.0, 1000.0, 5000.0]
    data:
    # Low temperature
    - [0.5, 6.0e-02, -5.0e-05, 2.0e-08, -3.0e-12,
       -1.5e+04, 25.0]
    # High temperature
    - [15.0, 2.0e-02, -8.0e-06, 1.5e-09, -9.0e-14,
       -2.0e+04, -40.0]
    note: Phenol, simplified thermodynamics

- name: C7H8
  composition: {C: 7, H: 8}
  thermo:
    model: NASA7
    temperature-ranges: [300.0, 1000.0, 5000.0]
    data:
    # Low temperature (from NIST)
    - [1.25, 6.0e-02, -4.0e-05, 1.5e-08, -2.0e-12,
       4.0e+03, 23.0]
    # High temperature
    - [16.5, 2.5e-02, -9.0e-06, 1.6e-09, -9.5e-14,
       -1.0e+03, -50.0]
    note: Toluene, NASA polynomial approximation

- name: C4H4O
  composition: {C: 4, H: 4, O: 1}
  thermo:
    model: NASA7
    temperature-ranges: [300.0, 1000.0, 5000.0]
    data:
    # Low temperature
    - [2.0, 3.5e-02, -3.0e-05, 1.2e-08, -1.8e-12,
       -1.4e+04, 15.0]
    # High temperature
    - [10.0, 1.5e-02, -5.5e-06, 9.0e-10, -5.2e-14,
       -1.6e+04, -25.0]
    note: Furan, simplified thermodynamics

- name: C3H6O
  composition: {C: 3, H: 6, O: 1}
  thermo:
    model: NASA7
    temperature-ranges: [300.0, 1000.0, 5000.0]
    data:
    # Low temperature (acetone from literature)
    - [4.5, 2.0e-02, 2.0e-05, -3.5e-08, 1.4e-11,
       -2.8e+04, 8.0]
    # High temperature
    - [10.5, 2.2e-02, -8.0e-06, 1.3e-09, -7.5e-14,
       -3.0e+04, -22.0]
    note: Acetone, simplified thermodynamics

# ============================================================================
# SIMPLIFIED DECOMPOSITION REACTIONS
# ============================================================================
# These reactions allow bio-oil species to decompose into GRI-Mech species
# Equilibrium calculations will then use GRI-Mech kinetics
# Note: Actual steam reforming uses Gibbs minimization, not these kinetics

reactions:
# Ethanol steam reforming
# C2H5OH + H2O → 2CO + 4H2 (C2H6O + H2O = 2CO + 4H2, balanced)
- equation: C2H5OH + H2O => 2 CO + 4 H2
  rate-constant: {A: 1.0e+10, b: 0.0, Ea: 15000.0}
  note: Ethanol decomposition

# Acetic acid decomposition
# CH3COOH → 2CO + 2H2 (C2H4O2 = 2CO + 2H2, check: C=2, H=4, O=2; Products: C=2, H=4, O=2, balanced)
- equation: CH3COOH => 2 CO + 2 H2
  rate-constant: {A: 1.0e+09, b: 0.0, Ea: 12000.0}
  note: Acetic acid decomposition

# Toluene steam reforming
# C7H8 + 7H2O → 7CO + 11H2 (C7H8 + 7H2O = 7CO + 11H2, check: C=7, H=8+14=22, O=7; Products: C=7, H=22, O=7, balanced)
- equation: C7H8 + 7 H2O => 7 CO + 11 H2
  rate-constant: {A: 1.0e+10, b: 0.0, Ea: 20000.0}
  note: Toluene decomposition

# Phenol steam reforming
# C6H6O + 5H2O → 6CO + 8H2 (C6H6O + 5H2O = 6CO + 8H2, check: C=6, H=6+10=16, O=1+5=6; Products: C=6, H=16, O=6, balanced)
- equation: C6H6O + 5 H2O => 6 CO + 8 H2
  rate-constant: {A: 1.0e+10, b: 0.0, Ea: 18000.0}
  note: Phenol decomposition

# Furan steam reforming
# C4H4O + 3H2O → 4CO + 5H2 (C4H4O + 3H2O = 4CO + 5H2, check: C=4, H=4+6=10, O=1+3=4; Products: C=4, H=10, O=4, balanced)
- equation: C4H4O + 3 H2O => 4 CO + 5 H2
  rate-constant: {A: 1.0e+09, b: 0.0, Ea: 16000.0}
  note: Furan decomposition

# Acetone steam reforming
# C3H6O + 2H2O → 3CO + 5H2 (C3H6O + 2H2O = 3CO + 5H2, check: C=3, H=6+4=10, O=1+2=3; Products: C=3, H=10, O=3, balanced)
- equation: C3H6O + 2 H2O => 3 CO + 5 H2
  rate-constant: {A: 1.0e+09, b: 0.0, Ea: 14000.0}
  note: Acetone decomposition
