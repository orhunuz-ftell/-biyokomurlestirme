<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algoritma Akış Şemaları</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            body { margin: 0; padding: 0; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Lucide icons as simple SVG components
        const ArrowDown = ({size = 24, className = ""}) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}>
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <polyline points="19 12 12 19 5 12"></polyline>
            </svg>
        );

        const ArrowRight = ({size = 24, className = ""}) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}>
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        );

        const Database = ({size = 24, className = ""}) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}>
                <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
                <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
            </svg>
        );

        const Activity = ({size = 24, className = ""}) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}>
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
            </svg>
        );

        const Droplet = ({size = 24, className = ""}) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}>
                <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
            </svg>
        );

        const Wind = ({size = 24, className = ""}) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}>
                <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"></path>
            </svg>
        );

        const Flame = ({size = 24, className = ""}) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={className}>
                <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path>
            </svg>
        );

        // --- Reusable UI Components (Visio Style) ---
        const VisioBox = ({ children, title, type = "process", className = "" }) => {
          const baseStyle = "relative border-2 flex flex-col items-center justify-center p-4 shadow-sm transition-all hover:shadow-md bg-white";

          let shapeStyle = "";
          let headerStyle = "font-bold text-sm mb-2 text-center w-full border-b pb-1 mb-2";

          switch (type) {
            case "start":
            case "end":
              shapeStyle = "rounded-full border-green-600 bg-green-50 min-w-[120px]";
              headerStyle = "hidden";
              break;
            case "process":
              shapeStyle = "rounded-sm border-blue-800 min-w-[180px]";
              headerStyle = "font-bold text-blue-900 border-blue-100 text-sm mb-2 text-center w-full border-b pb-1";
              break;
            case "input":
              shapeStyle = "rounded-sm border-orange-600 skew-x-[-10deg] min-w-[160px] mx-4";
              headerStyle = "font-bold text-orange-800 border-orange-200 text-sm mb-2 text-center w-full border-b pb-1 skew-x-[10deg]";
              break;
            case "decision":
              shapeStyle = "rotate-45 border-purple-600 w-32 h-32 flex items-center justify-center";
              headerStyle = "hidden";
              break;
            case "container":
              shapeStyle = "border-dashed border-gray-400 bg-gray-50 rounded-lg p-6 w-full";
              headerStyle = "font-bold text-gray-600 text-lg mb-4 text-center w-full uppercase tracking-wider";
              break;
            default:
              shapeStyle = "border-gray-800";
          }

          const innerContent = type === "decision" ? (
            <div className="-rotate-45 text-center text-xs font-semibold">{children}</div>
          ) : (
            <div className={type === "input" ? "skew-x-[10deg]" : ""}>
              {title && <div className={headerStyle}>{title}</div>}
              <div className="text-xs text-gray-700 text-center leading-tight">{children}</div>
            </div>
          );

          return (
            <div className={`${baseStyle} ${shapeStyle} ${className}`}>
              {innerContent}
            </div>
          );
        };

        const Arrow = ({ direction = "down", label = "" }) => {
          const icon = direction === "down" ? <ArrowDown size={20} className="text-gray-500" /> : <ArrowRight size={20} className="text-gray-500" />;
          return (
            <div className={`flex items-center justify-center ${direction === "down" ? "h-12 w-full flex-col" : "w-12 h-full flex-row"}`}>
              {label && <span className="text-[10px] text-gray-500 bg-white px-1 mb-1">{label}</span>}
              {icon}
            </div>
          );
        };

        // [BURAYA DİĞER TÜM DİYAGRAM BİLEŞENLERİNİ EKLEYIN - MainSystemDiagram, CanteraDiagram, vb.]

        // Ana Component
        function AlgorithmFlowcharts() {
          const [activeTab, setActiveTab] = useState(0);

          const tabs = [
            { title: "Ana Sistem", component: <div className="p-8 text-center">Placeholder - Tüm bileşenleri ekleyin</div> },
          ];

          return (
            <div className="flex h-screen bg-gray-100 font-sans text-gray-900">
              <div className="w-64 bg-white border-r shadow-sm flex flex-col no-print">
                <div className="p-4 border-b bg-blue-900 text-white">
                  <h1 className="font-bold text-lg">Algoritma Görselleştirici</h1>
                  <p className="text-xs text-blue-200 mt-1">Word/Visio Uyumlu Çıktı</p>
                </div>
                <nav className="flex-1 overflow-y-auto py-4">
                  {tabs.map((tab, index) => (
                    <button
                      key={index}
                      onClick={() => setActiveTab(index)}
                      className={`w-full text-left px-6 py-3 text-sm font-medium transition-colors ${
                        activeTab === index
                          ? "bg-blue-50 text-blue-700 border-r-4 border-blue-700"
                          : "text-gray-600 hover:bg-gray-50"
                      }`}
                    >
                      {index + 1}. {tab.title}
                    </button>
                  ))}
                </nav>
                <button
                  onClick={() => window.print()}
                  className="m-4 p-3 bg-blue-600 text-white rounded hover:bg-blue-700 font-bold"
                >
                  🖨️ PDF Olarak Kaydet
                </button>
              </div>

              <div className="flex-1 overflow-auto bg-gray-200 p-8 flex justify-center items-start">
                <div className="bg-white shadow-2xl min-h-[1000px] w-full max-w-5xl rounded-sm p-8 border border-gray-300 print:shadow-none print:border-none print:w-full print:max-w-none">
                   {tabs[activeTab].component}
                </div>
              </div>
            </div>
          );
        }

        ReactDOM.render(<AlgorithmFlowcharts />, document.getElementById('root'));
    </script>
</body>
</html>
