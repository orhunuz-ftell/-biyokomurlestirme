<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algoritma Akış Şemaları - Orhun Uzdiyem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        @media print {
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-gray-100">
    <div id="app"></div>

    <script>
        // Simple icons
        const Icons = {
            ArrowDown: (size = 20) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>`,
            ArrowRight: (size = 20) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>`,
            Database: (size = 32) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>`,
            Activity: (size = 32) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>`,
            Droplet: (size = 16) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>`,
            Wind: (size = 16) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/></svg>`,
            Flame: (size = 24) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>`
        };

        class App {
            constructor() {
                this.currentTab = 0;
                this.tabs = [
                    'Ana Sistem',
                    'Cantera Simülasyon',
                    'MLP Mimarisi',
                    'Eğitim Süreci',
                    'Ters Tahmin',
                    'Performans/Ensemble',
                    'Özellik Önemi',
                    'Hidrojen Üretim Prosesi'
                ];
                this.render();
            }

            setTab(index) {
                this.currentTab = index;
                this.render();
            }

            getDiagramHTML(index) {
                switch(index) {
                    case 0: return this.getMainSystemDiagram();
                    case 1: return this.getCanteraDiagram();
                    case 2: return this.getMLPDiagram();
                    case 3: return this.getTrainingDiagram();
                    case 4: return this.getReversePredictionDiagram();
                    case 5: return this.getPerformanceDiagram();
                    case 6: return this.getFeatureImportanceDiagram();
                    case 7: return this.getHydrogenProcessDiagram();
                    default: return '<div>Bilinmeyen diyagram</div>';
                }
            }

            getMainSystemDiagram() {
                return `
                    <div class="flex flex-col items-center space-y-4 w-full max-w-4xl mx-auto p-8 bg-white min-h-[1000px]">
                        <h2 class="text-2xl font-bold text-blue-900 mb-6 uppercase border-b-4 border-blue-900 pb-2 w-full text-center">1. BİYO-YAĞ TERS TAHMİN SİSTEMİ</h2>

                        <!-- Step 1: Data Generation -->
                        <div class="border-2 border-dashed border-gray-400 bg-gray-50 rounded-lg p-6 w-full">
                            <div class="font-bold text-gray-600 text-lg mb-4 text-center uppercase tracking-wider">1. Veri Oluşturma (Cantera Simulation)</div>
                            <div class="flex flex-row items-center justify-center space-x-4">
                                <div class="flex flex-col space-y-2">
                                    <div class="border-2 border-orange-600 bg-white rounded p-4 min-w-[160px] transform skew-x-[-10deg] shadow">
                                        <div class="transform skew-x-[10deg]">
                                            <div class="font-bold text-orange-800 text-sm mb-2 text-center border-b border-orange-200 pb-1">Girdi 1</div>
                                            <div class="text-xs text-gray-700 text-center">30 Biyo-yağ<br/>Kompozisyonu</div>
                                        </div>
                                    </div>
                                    <div class="text-center font-bold text-gray-400 text-2xl">+</div>
                                    <div class="border-2 border-orange-600 bg-white rounded p-4 min-w-[160px] transform skew-x-[-10deg] shadow">
                                        <div class="transform skew-x-[10deg]">
                                            <div class="font-bold text-orange-800 text-sm mb-2 text-center border-b border-orange-200 pb-1">Girdi 2</div>
                                            <div class="text-xs text-gray-700 text-center">45 Proses Koşulu<br/>(5T × 3P × 3S/C)</div>
                                        </div>
                                    </div>
                                </div>
                                <div class="flex items-center justify-center w-12">${Icons.ArrowRight(20)}</div>
                                <div class="border-2 border-blue-800 bg-white rounded p-4 min-w-[180px] shadow">
                                    <div class="font-bold text-blue-900 text-sm mb-2 text-center border-b border-blue-100 pb-1">İşlem</div>
                                    <div class="text-xs text-gray-700 text-center">Cantera Gibbs<br/>Minimizasyonu</div>
                                </div>
                                <div class="flex items-center justify-center w-12">${Icons.ArrowRight(20)}</div>
                                <div class="border-2 border-blue-800 bg-white rounded p-4 min-w-[180px] shadow">
                                    <div class="font-bold text-blue-900 text-sm mb-2 text-center border-b border-blue-100 pb-1">Çıktı</div>
                                    <div class="text-xs text-gray-700 text-center">1,350 Simülasyon<br/>Veri Noktası</div>
                                </div>
                            </div>
                        </div>

                        <div class="flex items-center justify-center h-12">${Icons.ArrowDown(20)}</div>

                        <!-- Step 2: Data Prep -->
                        <div class="border-2 border-dashed border-gray-400 bg-gray-50 rounded-lg p-6 w-full">
                            <div class="font-bold text-gray-600 text-lg mb-4 text-center uppercase tracking-wider">2. Veri Hazırlama</div>
                            <div class="flex flex-row items-center justify-center space-x-4">
                                <div class="border-2 border-orange-600 bg-white rounded p-4 min-w-[160px] transform skew-x-[-10deg] shadow">
                                    <div class="transform skew-x-[10deg]">
                                        <div class="font-bold text-orange-800 text-sm mb-2 text-center border-b border-orange-200 pb-1">Ham Veri</div>
                                        <div class="text-xs text-gray-700 text-center">1,350 Veri</div>
                                    </div>
                                </div>
                                <div class="flex items-center justify-center w-12">${Icons.ArrowRight(20)}</div>
                                <div class="border-2 border-blue-800 bg-white rounded p-4 min-w-[180px] shadow">
                                    <div class="font-bold text-blue-900 text-sm mb-2 text-center border-b border-blue-100 pb-1">Ön İşleme</div>
                                    <div class="text-xs text-gray-700 text-center">Temizleme &<br/>Normalizasyon</div>
                                </div>
                                <div class="flex items-center justify-center w-12">${Icons.ArrowRight(20)}</div>
                                <div class="border-2 border-blue-800 bg-white rounded p-4 min-w-[180px] shadow">
                                    <div class="font-bold text-blue-900 text-sm mb-2 text-center border-b border-blue-100 pb-1">Veri Setleri</div>
                                    <div class="text-xs text-gray-700 text-center">Train: 944<br/>Val: 203<br/>Test: 203</div>
                                </div>
                            </div>
                        </div>

                        <div class="flex items-center justify-center h-12">${Icons.ArrowDown(20)}</div>

                        <!-- Step 3: Model Training -->
                        <div class="border-2 border-dashed border-gray-400 bg-gray-50 rounded-lg p-6 w-full">
                            <div class="font-bold text-gray-600 text-lg mb-4 text-center uppercase tracking-wider">3. Model Eğitimi</div>
                            <div class="grid grid-cols-3 gap-4 mb-4">
                                <div class="border-2 border-blue-800 bg-white rounded p-4 shadow">
                                    <div class="font-bold text-blue-900 text-sm mb-2 text-center border-b border-blue-100 pb-1">Lineer Regresyon</div>
                                    <div class="text-xs text-gray-700 text-center">R² = 0.332</div>
                                </div>
                                <div class="border-2 border-blue-800 bg-white rounded p-4 shadow">
                                    <div class="font-bold text-blue-900 text-sm mb-2 text-center border-b border-blue-100 pb-1">Random Forest</div>
                                    <div class="text-xs text-gray-700 text-center">R² = 0.571</div>
                                </div>
                                <div class="border-2 border-blue-800 bg-white rounded p-4 shadow">
                                    <div class="font-bold text-blue-900 text-sm mb-2 text-center border-b border-blue-100 pb-1">XGBoost</div>
                                    <div class="text-xs text-gray-700 text-center">R² = 0.603</div>
                                </div>
                            </div>
                            <div class="flex justify-center mb-4">${Icons.ArrowDown(20)}</div>
                            <div class="flex justify-center gap-4">
                                <div class="border-2 border-green-500 bg-green-50 rounded p-4 shadow-lg ring-2 ring-green-200">
                                    <div class="font-bold text-green-900 text-sm mb-2 text-center border-b border-green-100 pb-1">MLP Standard (En İyi) ★</div>
                                    <div class="text-xs text-gray-700 text-center">R² = 0.863<br/>(128-64-32 Nöron)</div>
                                </div>
                                <div class="border-2 border-blue-800 bg-white rounded p-4 shadow">
                                    <div class="font-bold text-blue-900 text-sm mb-2 text-center border-b border-blue-100 pb-1">MLP Constrained</div>
                                    <div class="text-xs text-gray-700 text-center">R² = 0.745<br/>(Softmax Çıkış)</div>
                                </div>
                            </div>
                        </div>

                        <div class="flex items-center justify-center h-12">${Icons.ArrowDown(20)}</div>

                        <!-- Step 4: Prediction -->
                        <div class="border-2 border-dashed border-gray-400 bg-gray-50 rounded-lg p-6 w-full">
                            <div class="font-bold text-gray-600 text-lg mb-4 text-center uppercase tracking-wider">4. Tahmin Aşaması</div>
                            <div class="flex flex-row items-center justify-center space-x-4">
                                <div class="border-2 border-orange-600 bg-white rounded p-4 min-w-[200px] transform skew-x-[-10deg] shadow">
                                    <div class="transform skew-x-[10deg]">
                                        <div class="font-bold text-orange-800 text-sm mb-2 text-center border-b border-orange-200 pb-1">Giriş (8 Özellik)</div>
                                        <div class="text-xs text-gray-700 text-center">Sıngaz Ölçümü<br/>(H2, CO, CO2, CH4,<br/>H2O, T, P, S/C)</div>
                                    </div>
                                </div>
                                <div class="flex items-center justify-center w-12">${Icons.ArrowRight(20)}</div>
                                <div class="border-2 border-blue-800 bg-white rounded p-4 min-w-[180px] shadow">
                                    <div class="font-bold text-blue-900 text-sm mb-2 text-center border-b border-blue-100 pb-1">Model</div>
                                    <div class="text-xs text-gray-700 text-center">MLP Standard<br/>Tahminleyici</div>
                                </div>
                                <div class="flex items-center justify-center w-12">${Icons.ArrowRight(20)}</div>
                                <div class="border-2 border-blue-800 bg-white rounded p-4 min-w-[200px] shadow">
                                    <div class="font-bold text-blue-900 text-sm mb-2 text-center border-b border-blue-100 pb-1">Çıkış (6 Bileşen)</div>
                                    <div class="text-xs text-gray-700 text-center">Biyo-yağ Tahmini<br/>(Aromatik, Asitler,<br/>Alkoller, vb.)</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            getCanteraDiagram() {
                return `
                    <div class="flex flex-col items-center space-y-4 w-full max-w-3xl mx-auto p-8 bg-white min-h-[1000px]">
                        <h2 class="text-2xl font-bold text-blue-900 mb-6 uppercase border-b-4 border-blue-900 pb-2 w-full text-center">2. CANTERA SİMÜLASYON SÜRECİ</h2>

                        <div class="border-2 border-orange-600 bg-white rounded p-6 w-full max-w-md transform skew-x-[-10deg] shadow">
                            <div class="transform skew-x-[10deg]">
                                <div class="font-bold text-orange-800 text-lg mb-3 text-center border-b border-orange-200 pb-2">GİRİŞLER</div>
                                <ul class="text-left list-disc list-inside text-sm space-y-1">
                                    <li>Biyo-yağ kompozisyonu (6 bileşen)</li>
                                    <li>Sıcaklık T [650-850°C]</li>
                                    <li>Basınç P [5-30 bar]</li>
                                    <li>Buhar/Karbon S/C [2-6]</li>
                                </ul>
                            </div>
                        </div>

                        <div class="flex items-center justify-center h-12">${Icons.ArrowDown(20)}</div>

                        <div class="border-2 border-blue-800 bg-white rounded p-6 w-full max-w-md shadow">
                            <div class="font-bold text-blue-900 text-lg mb-3 text-center border-b border-blue-100 pb-2">VEKİL MOLEKÜL DÖNÜŞÜMÜ</div>
                            <div class="grid grid-cols-2 gap-3 text-sm">
                                <span>Aromatikler → C₇H₈</span>
                                <span>Asitler → CH₃COOH</span>
                                <span>Alkoller → C₂H₅OH</span>
                                <span>Furanlar → C₄H₄O</span>
                                <span>Fenoller → C₆H₆O</span>
                                <span>Ald-Ketonlar → C₃H₆O</span>
                            </div>
                        </div>

                        <div class="flex items-center justify-center h-12">${Icons.ArrowDown(20)}</div>

                        <div class="border-2 border-yellow-500 bg-yellow-50 rounded p-6 w-full max-w-md shadow-lg">
                            <div class="font-bold text-yellow-900 text-lg mb-3 text-center border-b border-yellow-200 pb-2">DENGE HESABI</div>
                            <div class="text-center italic text-sm mb-3 font-mono bg-white p-2 rounded">minimize G = Σ(nᵢ × μᵢ)</div>
                            <div class="text-left text-sm space-y-2">
                                <div>• Element Korunumu (C, H, O)</div>
                                <div>• Pozitif Mol Sayısı (nᵢ ≥ 0)</div>
                                <div>• Sabit T ve P (Gibbs Minimizasyonu)</div>
                                <div class="mt-3 font-mono bg-gray-100 p-2 rounded text-center font-bold">gas.equilibrate('TP')</div>
                            </div>
                        </div>

                        <div class="flex items-center justify-center h-12">${Icons.ArrowDown(20)}</div>

                        <div class="border-2 border-blue-800 bg-white rounded p-6 w-full max-w-md shadow">
                            <div class="font-bold text-blue-900 text-lg mb-3 text-center border-b border-blue-100 pb-2">ÇIKIŞLAR (Sıngaz)</div>
                            <div class="grid grid-cols-2 gap-x-8 gap-y-2 text-sm">
                                <div><span class="font-bold">H₂:</span> ~16-50%</div>
                                <div><span class="font-bold">CH₄:</span> ~0-19%</div>
                                <div><span class="font-bold">CO:</span> ~1-20%</div>
                                <div><span class="font-bold">H₂O:</span> Kalan</div>
                                <div><span class="font-bold">CO₂:</span> ~7-17%</div>
                                <div class="col-span-2 text-center mt-2 pt-2 border-t border-gray-200">+ Termodinamik Özellikler</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            getMLPDiagram() {
                return `
                    <div class="flex flex-col items-center w-full max-w-4xl mx-auto p-8 bg-white min-h-[1000px]">
                        <h2 class="text-2xl font-bold text-blue-900 mb-8 uppercase border-b-4 border-blue-900 pb-2 w-full text-center">3. MLP MODEL MİMARİSİ</h2>

                        <div class="flex flex-row items-center justify-between w-full space-x-6">
                            <!-- Input Layer -->
                            <div class="flex flex-col space-y-3 items-center">
                                <h3 class="font-bold text-base mb-3 text-blue-800">Giriş (8)</h3>
                                ${['T', 'P', 'S/C', 'H₂', 'CO', 'CO₂', 'CH₄', 'H₂O'].map(item =>
                                    `<div class="w-20 h-10 border-2 border-gray-400 rounded flex items-center justify-center text-sm bg-gray-50 shadow font-semibold">${item}</div>`
                                ).join('')}
                            </div>

                            <!-- Connection 1 -->
                            <div class="flex-1 h-96 border-l-2 border-r-2 border-dashed border-gray-300 relative flex items-center justify-center">
                                <span class="bg-white px-3 py-1 text-xs text-gray-500 border rounded">Tam Bağlantılı</span>
                            </div>

                            <!-- Hidden Layer 1 -->
                            <div class="flex flex-col items-center">
                                <h3 class="font-bold text-base mb-3 text-purple-800">Gizli 1</h3>
                                <div class="w-16 h-80 border-2 border-purple-300 bg-purple-50 rounded-lg flex flex-col items-center justify-center space-y-2 py-4 shadow">
                                    <div class="w-10 h-10 rounded-full bg-purple-300"></div>
                                    <div class="w-10 h-10 rounded-full bg-purple-300"></div>
                                    <div class="text-xl text-purple-800 font-bold">⋮</div>
                                    <div class="text-base font-bold text-purple-900">128</div>
                                    <div class="text-xs text-gray-600 bg-white px-2 py-1 rounded">ReLU</div>
                                </div>
                                <div class="text-xs mt-2 text-gray-500">Dropout 30%</div>
                            </div>

                            <div class="flex items-center justify-center">${Icons.ArrowRight(20)}</div>

                            <!-- Hidden Layer 2 -->
                            <div class="flex flex-col items-center">
                                <h3 class="font-bold text-base mb-3 text-purple-800">Gizli 2</h3>
                                <div class="w-16 h-64 border-2 border-purple-300 bg-purple-50 rounded-lg flex flex-col items-center justify-center space-y-2 py-4 shadow">
                                    <div class="w-10 h-10 rounded-full bg-purple-300"></div>
                                    <div class="w-10 h-10 rounded-full bg-purple-300"></div>
                                    <div class="text-xl text-purple-800 font-bold">⋮</div>
                                    <div class="text-base font-bold text-purple-900">64</div>
                                    <div class="text-xs text-gray-600 bg-white px-2 py-1 rounded">ReLU</div>
                                </div>
                                <div class="text-xs mt-2 text-gray-500">Dropout 20%</div>
                            </div>

                            <div class="flex items-center justify-center">${Icons.ArrowRight(20)}</div>

                            <!-- Hidden Layer 3 -->
                            <div class="flex flex-col items-center">
                                <h3 class="font-bold text-base mb-3 text-purple-800">Gizli 3</h3>
                                <div class="w-16 h-48 border-2 border-purple-300 bg-purple-50 rounded-lg flex flex-col items-center justify-center space-y-2 py-4 shadow">
                                    <div class="w-10 h-10 rounded-full bg-purple-300"></div>
                                    <div class="text-xl text-purple-800 font-bold">⋮</div>
                                    <div class="text-base font-bold text-purple-900">32</div>
                                    <div class="text-xs text-gray-600 bg-white px-2 py-1 rounded">ReLU</div>
                                </div>
                                <div class="text-xs mt-2 text-gray-500">Dropout 10%</div>
                            </div>

                            <div class="flex items-center justify-center">${Icons.ArrowRight(20)}</div>

                            <!-- Output Layer -->
                            <div class="flex flex-col space-y-3 items-center">
                                <h3 class="font-bold text-base mb-3 text-green-800">Çıkış (6)</h3>
                                ${['Aromatik', 'Asitler', 'Alkoller', 'Furanlar', 'Fenoller', 'Ketonlar'].map(item =>
                                    `<div class="w-24 h-12 border-2 border-green-600 bg-green-50 rounded flex items-center justify-center text-xs font-bold shadow">${item}</div>`
                                ).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }

            getTrainingDiagram() {
                return `
                    <div class="flex flex-col items-center w-full max-w-2xl mx-auto p-8 bg-white min-h-[1000px]">
                        <h2 class="text-2xl font-bold text-blue-900 mb-8 uppercase border-b-4 border-blue-900 pb-2 w-full text-center">4. EĞİTİM SÜRECİ</h2>

                        <div class="rounded-full border-2 border-green-600 bg-green-50 px-6 py-3 shadow font-bold">BAŞLA</div>
                        <div class="flex items-center justify-center h-12">${Icons.ArrowDown(20)}</div>

                        <div class="border-2 border-blue-800 bg-white rounded p-4 w-full max-w-md shadow">
                            <div class="font-bold text-blue-900 text-sm mb-2 text-center border-b border-blue-100 pb-1">Veri Yükleme</div>
                            <div class="text-xs text-gray-700 text-center">1,350 Örnek Yükle<br/>Train / Val / Test Böl</div>
                        </div>

                        <div class="flex items-center justify-center h-12">${Icons.ArrowDown(20)}</div>

                        <div class="border-2 border-blue-800 bg-white rounded p-4 w-full max-w-md shadow">
                            <div class="font-bold text-blue-900 text-sm mb-2 text-center border-b border-blue-100 pb-1">Ön İşleme</div>
                            <div class="text-xs text-gray-700 text-center">StandardScaler (Normalizasyon)</div>
                        </div>

                        <div class="flex items-center justify-center h-12">${Icons.ArrowDown(20)}</div>

                        <div class="border-2 border-blue-800 bg-white rounded p-4 w-full max-w-md shadow">
                            <div class="font-bold text-blue-900 text-sm mb-2 text-center border-b border-blue-100 pb-1">Model Başlatma</div>
                            <div class="text-xs text-gray-700 text-center">Ağırlıkları Rastgele Ata</div>
                        </div>

                        <div class="flex items-center justify-center h-12">${Icons.ArrowDown(20)}</div>

                        <!-- Epoch Loop -->
                        <div class="border-l-4 border-dashed border-gray-400 pl-8 py-6 relative w-full">
                            <div class="absolute -left-8 top-1/2 transform -translate-y-1/2 -rotate-90 text-gray-500 font-bold tracking-widest text-xs whitespace-nowrap">EPOCH DÖNGÜSÜ</div>

                            <div class="flex flex-col items-center space-y-4">
                                <div class="border-2 border-blue-800 bg-white rounded p-4 w-full max-w-md shadow">
                                    <div class="font-bold text-blue-900 text-sm mb-2 text-center border-b border-blue-100 pb-1">Forward Pass</div>
                                    <div class="text-xs text-gray-700 text-center">Tahmin = Model(X)</div>
                                </div>

                                <div class="flex items-center justify-center h-12">${Icons.ArrowDown(20)}</div>

                                <div class="border-2 border-blue-800 bg-white rounded p-4 w-full max-w-md shadow">
                                    <div class="font-bold text-blue-900 text-sm mb-2 text-center border-b border-blue-100 pb-1">Loss Hesapla</div>
